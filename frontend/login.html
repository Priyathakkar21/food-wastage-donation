<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>FoodShare - Login</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body class="login-body">

    <div class="login-container">

        <div class="logo">
            🍱
        </div>

        <h1>
            FoodShare
        </h1>

        <p class="subtitle">
            Food Donation & Sharing Platform
        </p>

        <form id="loginForm">

            <label>
                Email
            </label>

            <input
                type="email"
                id="loginEmail"
                placeholder="Enter your email"
                required
            >

            <label>
                Password
            </label>

            <input
                type="password"
                id="loginPassword"
                placeholder="Enter your password"
                required
            >

            <button type="submit">
                Login
            </button>

            <p id="loginMessage"></p>

        </form>

        <p class="register-text">

            Don't have an account?

            <a href="register.html">
                Create Account
            </a>

        </p>

    </div>


    <script src="js/script.js"></script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>FoodShare - Register</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body class="login-body">

    <div class="login-container">

        <div class="logo">
            🍱
        </div>

        <h1>
            Create Account
        </h1>

        <p class="subtitle">
            Join FoodShare
        </p>

        <form id="registerForm">

            <label>
                Name
            </label>

            <input
                type="text"
                id="registerName"
                placeholder="Enter your name"
                required
            >

            <label>
                Email
            </label>

            <input
                type="email"
                id="registerEmail"
                placeholder="Enter your email"
                required
            >

            <label>
                Password
            </label>

            <input
                type="password"
                id="registerPassword"
                placeholder="Create password"
                required
            >

            <label for="registerRole">Register As:</label>

<select id="registerRole">
    <option value="donor">Donor / User</option>
    <option value="ngo">NGO</option>
</select>

            <button type="submit">
                Register
            </button>

            <p id="registerMessage"></p>

        </form>

        <p class="register-text">

            Already have an account?

            <a href="index.html">
                Login
            </a>

        </p>

    </div>


    <script src="js/script.js"></script>

</body>

</html>

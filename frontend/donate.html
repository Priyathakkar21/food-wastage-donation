<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>FoodShare - Donate Food</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>
<nav class="navbar">

    <h2>🍱 FoodShare</h2>

    <div>

        <a href="dashboard.html">Dashboard</a>

        <a href="donate.html">Donate Food</a>

        <a href="donations.html">Donations</a>

        <a href="history.html">History</a>

        <a href="profile.html">Profile</a>

        <!-- ADMIN MENU -->
        <a href="admin.html" id="adminMenu" style="display: none;">
            Admin
        </a>

        <button id="logoutBtn">
            Logout
        </button>

    </div>

</nav>

    <main class="form-page">

        <div class="donation-form">

            <h1>
                🍱 Donate Food
            </h1>

            <p>
                Share extra food instead of wasting it.
            </p>


            <form id="donationForm">

                <label>
                    Food Name
                </label>

                <input
                    type="text"
                    id="foodName"
                    placeholder="Example: Rice, Roti, Vegetables"
                    required
                >


                <label>
                    Quantity
                </label>

                <input
                    type="number"
                    id="quantity"
                    placeholder="Quantity in kg"
                    min="1"
                    required
                >


                <label>
                    Location
                </label>

                <input
                    type="text"
                    id="location"
                    placeholder="Enter food pickup location"
                    required
                >


                <label>
                    Description
                </label>

                <textarea
                    id="description"
                    placeholder="Describe the food..."
                ></textarea>


                <button type="submit">
                    Donate Food
                </button>

                <p id="donationMessage"></p>

            </form>

        </div>

    </main>


    <script src="js/script.js"></script>

</body>

</html>
